name: relaydesk
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relaydesk
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: relaydesk
    ports: ["127.0.0.1:55520:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaydesk -d relaydesk"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  db:
